<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PassPick · 자격증 시험 조건 탐색</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">PassPick</div></div>
  <section class="view" id="v-home"></section>
  <section class="view" id="v-list" hidden>
    <input class="inp" id="q" type="search" placeholder="🔍 자격증명 · 키워드 검색" autocomplete="off" aria-label="자격증 검색">
    <div id="lb"></div>
  </section>
  <section class="view" id="v-my" hidden></section>
  <nav class="nav"><button data-act="nav" data-v="home">홈</button><button data-act="nav" data-v="list">자격증 목록</button><button data-act="nav" data-v="my">마이</button></nav>
  <div id="modal"></div>
</div>
<div class="dev"><span>시연용</span><button data-act="demoErr">오류 상태 시연</button><button data-act="resetData">저장 데이터 초기화</button></div>
<div class="dev">예시 데이터(가상 일정·금액)입니다. 실제 응시 자격과 일정은 공식 접수처에서 확인하세요.</div>
<script src="js/app.js"></script>
</body>
</html>
